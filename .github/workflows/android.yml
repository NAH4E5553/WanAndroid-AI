name: Android CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: CI Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_android: ${{ steps.classify.outputs.run_android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install configuration test dependencies
        run: python -m pip install -r .github/tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate workflows and classifier regression tests
        run: |
          python .github/scripts/prepare_ocr_action.py
          python -m unittest discover -s .github/tests -v
      - name: Install pinned workflow linter
        run: python .github/scripts/install_actionlint.py
      - name: Lint GitHub Actions expressions and workflow syntax
        run: build/ci-tools/actionlint -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Validate Bash syntax
        run: bash -n .github/scripts/should-run-android-ci.sh
      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] ||
             [[ -z "$BASE_SHA" ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            run_android=true
          else
            run_android="$(bash .github/scripts/should-run-android-ci.sh "$BASE_SHA" "$HEAD_SHA" "$EVENT_NAME")"
          fi
          if [[ "$run_android" != "true" && "$run_android" != "false" ]]; then
            echo "::error::Invalid CI classification"
            exit 1
          fi
          echo "run_android=$run_android" >> "$GITHUB_OUTPUT"

  checks:
    name: ${{ matrix.name }}
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build
            task: ':app:assembleDebug'
            report: 'app/build/outputs/apk/debug/*.apk'
          - name: Unit Tests
            task: testAll
            report: |
              **/build/reports/tests/test/
              **/build/test-results/test/
              **/build/reports/tests/testDebugUnitTest/
              **/build/test-results/testDebugUnitTest/
          - name: Android Lint
            task: lintDebug
            report: '**/build/reports/lint-results-*'
          - name: Code Format
            task: spotlessCheck
            report: ''
          - name: Architecture
            task: verifyArchitecture
            report: ''
    steps:
      - name: Fail closed if configuration or classification failed
        env:
          CONFIG_RESULT: ${{ needs.changes.result }}
          RUN_ANDROID: ${{ needs.changes.outputs.run_android }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIG_RESULT" != "success" ]] ||
             [[ "$RUN_ANDROID" != "true" && "$RUN_ANDROID" != "false" ]]; then
            echo "::error::CI configuration/classification failed; checks cannot be skipped safely"
            exit 1
          fi
      - name: Document-only change
        if: needs.changes.outputs.run_android == 'false'
        run: echo "Configuration passed. Android tasks are not needed for this documentation-only change."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_android == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: needs.changes.outputs.run_android == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: needs.changes.outputs.run_android == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: needs.changes.outputs.run_android == 'true'
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run verification
        if: needs.changes.outputs.run_android == 'true'
        env:
          GRADLE_TASK: ${{ matrix.task }}
        run: ./gradlew "$GRADLE_TASK" --no-daemon --stacktrace
      - name: Upload diagnostic reports
        if: always() && needs.changes.outputs.run_android == 'true' && matrix.report != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-reports
          path: ${{ matrix.report }}
          if-no-files-found: ignore
          retention-days: 7
